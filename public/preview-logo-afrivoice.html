<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Logo Officiel AfriVoice AI — Fond Blanc</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      background-color: #F4F5F7;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: white;
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      max-width: 800px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    h1 {
      margin-top: 0;
      color: #111111;
      font-size: 26px;
      font-weight: 800;
    }
    p {
      color: #666;
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
    .box {
      background: #FFFFFF;
      border: 2px solid #EAEAEA;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .box img {
      max-width: 100%;
      height: auto;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Logo Officiel AfriVoice AI (Fond Blanc)</h1>
    <p>Décliné au format carré (icône) et au format horizontal (bannière/navbar)</p>

    <div class="grid">
      <div class="box">
        <img src="afrivoice_logo_carrer_fond_blanc.png" alt="AfriVoice AI Carré Fond Blanc">
        <div class="title">Format Carré / App Icon</div>
      </div>
      <div class="box">
        <img src="afrivoice_logo_horizontal_fond_blanc.png" alt="AfriVoice AI Horizontal Fond Blanc">
        <div class="title">Format Horizontal / Navbar</div>
      </div>
    </div>
  </div>
</body>
</html>
