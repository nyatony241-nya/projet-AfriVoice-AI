<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&amp;display=swap');
      .brand-text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 58px; }
      .dark-text { fill: #111111; }
      .lime-text { fill: #BCEB00; }
    </style>
  </defs>

  <!-- Fond Blanc Pur -->
  <rect width="600" height="600" fill="#FFFFFF"/>

  <!-- Icône Vert Citron Arrondie (Squircle) -->
  <g transform="translate(175, 75)">
    <rect width="250" height="250" rx="65" fill="#D4FF00"/>
    
    <!-- Microphone Noir -->
    <g fill="#111111" transform="translate(35, 20) scale(1.44)">
      <!-- Tête du micro -->
      <rect x="40" y="20" width="50" height="80" rx="25" />
      
      <!-- Lignes découpées -->
      <rect x="35" y="35" width="60" height="5" fill="#D4FF00" />
      <rect x="35" y="50" width="60" height="5" fill="#D4FF00" />
      <rect x="35" y="65" width="60" height="5" fill="#D4FF00" />
      <rect x="35" y="80" width="60" height="5" fill="#D4FF00" />

      <!-- Support en U -->
      <path d="M 25 60 v 25 a 40 40 0 0 0 80 0 v -25 h -8 v 25 a 32 32 0 0 1 -64 0 v -25 z" />
      
      <!-- Pied du support -->
      <rect x="61" y="125" width="8" height="20" />
      
      <!-- Base du pied -->
      <rect x="40" y="140" width="50" height="8" rx="3" />
    </g>
  </g>

  <!-- Texte : AfriVoice AI (Aligné & Centré) -->
  <text x="300" y="445" text-anchor="middle" class="brand-text">
    <tspan class="dark-text">AfriVoice </tspan>
    <tspan class="lime-text">AI</tspan>
  </text>
</svg>
